[project]
name = "Car API"
version = "0.1.0"
description = ""
authors = [
       {name = "Lucas", email = "contato.lucas55@gmail.com"}
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = 'ruff check'
lint_fix = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev ./main.py'
docs = 'mkdocs serve -a 127.0.0.1:8001'